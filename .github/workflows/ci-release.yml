name: Release CI

on:
  push:
    branches:
      - 'release/*'

jobs:
  release-checks:
    runs-on: ubuntu-latest
    environment: dev
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_REQUIRE_EMAIL_VERIFICATION: ${{ vars.FIREBASE_REQUIRE_EMAIL_VERIFICATION }}
      MAILER_API_KEY: ${{ secrets.MAILER_API_KEY }}
      MAILERSEND_FROM: ${{ secrets.MAILERSEND_FROM }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Smoke build
        run: npm run build

      - name: Smoke test (simple sanity check)
        run: |
          npm start &
          sleep 5
          curl -f http://localhost:3000 || exit 1

      - name: Security audit
        run: npm audit --production

      - name: Bump version and push tag
        uses: phips28/gh-action-bump-version@v10
        with:
          tag-prefix: "v"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  approval:
    needs: release-checks
    runs-on: ubuntu-latest
    steps:
      - name: Await manual approval
        uses: trstringer/manual-approval@v1
        with:
          approvers: jstryagain
          secret: ${{ secrets.GITHUB_TOKEN }}