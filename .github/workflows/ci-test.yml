name: CI Integration Test

on:
  push:
    branches:
      - test
  pull_request:

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ganda-app:${{ github.sha }}

      - name: Run container with envs
        run: |
          docker run -d --name ganda-app \
            -e FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            -e FIREBASE_SERVICE_ACCOUNT=${{ secrets.FIREBASE_SERVICE_ACCOUNT }} \
            -e MAILERSEND_API_KEY=${{ secrets.MAILERSEND_API_KEY }} \
            -e APP_URL=${{ vars.APP_URL }} \
            -e FIREBASE_REQUIRE_EMAIL_VERIFICATION=${{ vars.FIREBASE_REQUIRE_EMAIL_VERIFICATION }} \
            -e MAILERSEND_FROM=${{ vars.MAILERSEND_FROM }} \
            -p 3000:3000 ganda-app:${{ github.sha }}

          # wait for the app to boot
          sleep 15

      - name: Test health endpoint
        run: |
          curl -f http://localhost:3000/api/health || (docker logs ganda-app && exit 1)

      - name: Stop container
        if: always()
        run: docker rm -f ganda-app
