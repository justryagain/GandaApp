name: CI Integration Test

on:
  push:
    branches:
      - test

jobs:
  integration-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secret length
        run: |
          echo "Secret length: $(echo -n '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}' | wc -c)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ganda-app:${{ github.sha }}
          build-args: |
            FIREBASE_SERVICE_ACCOUNT_BASE64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}

      - name: Run container
        run: |
          docker run -d --name ganda-app \
            -e FIREBASE_SERVICE_ACCOUNT_BASE64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }} \
            -p 3000:3000 ganda-app:${{ github.sha }}

          echo "Container started successfully"

      - name: Cleanup
        if: always()
        run: docker rm -f ganda-app || true
