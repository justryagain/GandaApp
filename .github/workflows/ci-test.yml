name: CI Integration Test

on:
  push:
    branches:
      - your-new-branch # change this
  pull_request:
    branches:
      - your-new-branch # optional

jobs:
  integration-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (uses secret file)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ganda-app:${{ github.sha }}
          # Mount the JSON secret as a file during the build
          secrets: |
            "firebase_service_account=${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"  # <- RAW JSON (multiline) secret

      - name: Run container with envs (runtime injection)
        run: |
          docker run -d --name ganda-app \
            -e FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            -e FIREBASE_SERVICE_ACCOUNT=${{ secrets.FIREBASE_SERVICE_ACCOUNT }} \
            -e MAILERSEND_API_KEY=${{ secrets.MAILERSEND_API_KEY }} \
            -e APP_URL=${{ vars.APP_URL }} \
            -e FIREBASE_REQUIRE_EMAIL_VERIFICATION=${{ vars.FIREBASE_REQUIRE_EMAIL_VERIFICATION }} \
            -e MAILERSEND_FROM=${{ vars.MAILERSEND_FROM }} \
            -p 3000:3000 ganda-app:${{ github.sha }}

          # give Next.js time to boot
          for i in {1..20}; do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              echo "App is up"; exit 0
            fi
            echo "Waiting for app... ($i)"
            sleep 2
          done
          echo "App failed to start"; docker logs ganda-app; exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f ganda-app || true
