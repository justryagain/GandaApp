name: Dev CI

on:
  push:
    branches: [dev]

jobs:
  build_and_tests:
    name: Build & Tests
    runs-on: ubuntu-latest
    environment: dev
    env:
      APP_ENV: test
      APP_URL: ${{ vars.APP_URL }}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_REQUIRE_EMAIL_VERIFICATION: ${{ vars.FIREBASE_REQUIRE_EMAIL_VERIFICATION }}
      MAILER_API_KEY: ${{ secrets.MAILER_API_KEY }}
      MAILERSEND_FROM: ${{ vars.MAILERSEND_FROM }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --production
      - run: npx eslint . --ext .js,.ts --max-warnings=0

      - name: Decode Firebase service account for Cypress
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}" | base64 --decode > serviceAccount.json
          echo "FIREBASE_SERVICE_ACCOUNT=$(cat serviceAccount.json | jq -c .)" >> $GITHUB_ENV

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        env:
          APP_ENV: test
          APP_URL: ${{ vars.APP_URL }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        with:
          start: npm start
          wait-on: "http://localhost:3000"

  # 2) Docker build + smoke run
  docker_build:
    name: Docker Build & Run
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ganda-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FIREBASE_SERVICE_ACCOUNT_BASE64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
      - name: Smoke run
        run: |
          docker run -d --name ganda-app \
            -e FIREBASE_SERVICE_ACCOUNT_BASE64="${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}" \
            -p 3100:3000 ganda-app:${{ github.sha }}
          echo "Container started on http://localhost:3100"

      - name: Cleanup
        if: always()
        run: docker rm -f ganda-app || true
