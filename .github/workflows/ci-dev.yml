name: Dev CI

on:
  push:
    branches:
      - dev

jobs:
  dev-checks:
    runs-on: ubuntu-latest
    environment: dev
    env:
      APP_ENV: test
      APP_URL: ${{ vars.APP_URL }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_REQUIRE_EMAIL_VERIFICATION: ${{ vars.FIREBASE_REQUIRE_EMAIL_VERIFICATION }}
      MAILER_API_KEY: ${{ secrets.MAILER_API_KEY }}
      MAILERSEND_FROM: ${{ vars.MAILERSEND_FROM }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm start
          wait-on: "http://localhost:3000"

      - name: Run npm audit (dependencies)
        run: npm audit --production

      - name: Run security linting
        run: npx eslint . --ext .js,.ts --max-warnings=0

      - name: Build Docker image
        run: |
          docker build \
            -t ganda-app:${{ github.sha }} \
            --build-arg FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --build-arg FIREBASE_SERVICE_ACCOUNT=${{ secrets.FIREBASE_SERVICE_ACCOUNT }} \
            --build-arg MAILERSEND_API_KEY=${{ secrets.MAILERSEND_API_KEY }} \
            --build-arg APP_URL=${{ vars.APP_URL }} \
            --build-arg FIREBASE_REQUIRE_EMAIL_VERIFICATION=${{ vars.FIREBASE_REQUIRE_EMAIL_VERIFICATION }} \
            --build-arg MAILERSEND_FROM=${{ vars.MAILERSEND_FROM }} \
            .
