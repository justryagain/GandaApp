name: Dev CI

on:
  push:
    branches:
      - dev

jobs:
  dev-checks:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          build: npm run build
          start: npm start
          wait-on: 'http://localhost:3000'

      - name: Run npm audit (dependencies)
        run: npm audit --production

      - name: Run security linting
        run: npx eslint . --ext .js,.ts --max-warnings=0

      - name: Build Docker image
        run: docker build -t my-app:test .
