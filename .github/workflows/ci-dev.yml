name: Dev CI

on:
  push:
    branches:
      - dev

jobs:
  dev-checks:
    runs-on: ubuntu-latest
    environment: dev
    env:
      APP_ENV: test
      APP_URL: ${{ vars.APP_URL }}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_REQUIRE_EMAIL_VERIFICATION: ${{ vars.FIREBASE_REQUIRE_EMAIL_VERIFICATION }}
      MAILER_API_KEY: ${{ secrets.MAILER_API_KEY }}
      MAILERSEND_FROM: ${{ vars.MAILERSEND_FROM }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Decode Firebase service account for Cypress
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}" | base64 --decode > serviceAccount.json
          echo "FIREBASE_SERVICE_ACCOUNT=$(cat serviceAccount.json | jq -c .)" >> $GITHUB_ENV

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        with:
          build: npm run build
          start: npm start
          wait-on: "http://localhost:3000"

      - name: Run npm audit (dependencies)
        run: npm audit --production

      - name: Run security linting
        run: npx eslint . --ext .js,.ts --max-warnings=0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ganda-app:${{ github.sha }}
          build-args: |
            FIREBASE_SERVICE_ACCOUNT_BASE64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}

      - name: Run container
        run: |
          docker run -d --name ganda-app \
            -e FIREBASE_SERVICE_ACCOUNT_BASE64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }} \
            -p 3000:3000 ganda-app:${{ github.sha }}

          echo "Container started successfully"

      - name: Cleanup
        if: always()
        run: docker rm -f ganda-app || true
